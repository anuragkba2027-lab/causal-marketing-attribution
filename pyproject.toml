[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-marketing-benchmark"
version = "0.1.0"
description = "RCT-validated CATE benchmark comparing Microsoft/PyWhy EconML and Uber CausalML"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Causal ML Benchmark Contributors"}]
dependencies = [
  "causalml==0.16.0",
  "econml==0.16.0",
  "scikit-learn==1.6.1",
  "pandas>=2.2,<3.1",
  "numpy>=1.25",
  "scipy>=1.16",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
